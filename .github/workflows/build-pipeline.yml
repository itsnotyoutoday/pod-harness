name: Build lingua-pipeline

# One workflow per image.
#
# A single matrix built both, so a change to the MFA Dockerfile also started the slim
# image's job and vice versa — and a failure in either marked the whole run red, hiding
# which image was actually broken. Path filters live at the WORKFLOW level here, so an
# unaffected image's job never starts at all rather than starting and skipping.
on:
  push:
    branches: [main]
    paths:
      - 'docker/pipeline.Dockerfile'
      - 'requirements-pipeline.txt'
      # The engine and harness that EVERY image embeds. A change here genuinely
      # invalidates every image — each carries its own copy, so the copy really is stale.
      # This is not filterable; it is the price of baking the engine in, and the
      # alternative (fetching it at boot) reintroduces the version drift that cost three
      # separate incidents.
      - 'src/**'
      - 'serve/**'
      - 'docker/harness/**'
      - 'docker/assert_*.py'
      - 'contract.json'
      - '.github/workflows/build-pipeline.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract and independence checks run in test.yml, and again inside the
      # image build itself via assert_independence.py — so a broken image cannot be
      # published even if a workflow forgets to check.

      # A 6 GB image plus a conda environment plus build cache is tight against the
      # runner's ~14 GB. Reclaiming the preinstalled toolchains costs seconds and avoids a
      # no-space-left failure thirty minutes into a build.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Compute tags
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          SHA=$(git rev-parse --short HEAD)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          if [ -n "${{ secrets.DOCKERHUB_USER }}" ]; then
            HUB='${{ secrets.DOCKERHUB_USER }}'
            echo "tags=docker.io/$HUB/lingua-pipeline:latest,docker.io/$HUB/lingua-pipeline:$SHA" >> $GITHUB_OUTPUT
            echo "::notice::publishing to Docker Hub as $HUB/lingua-pipeline"
          else
            echo "tags=ghcr.io/$OWNER/lingua-pipeline:latest,ghcr.io/$OWNER/lingua-pipeline:$SHA" >> $GITHUB_OUTPUT
            echo "::warning::no DOCKERHUB_USER secret — publishing to GHCR, whose pull latency from RunPod is unpredictable"
          fi

      # Docker Hub is the publish target. GHCR serves through Fastly and DNS frequently
      # resolves to a distant or degraded edge: 45-minute pulls have been reported where
      # Docker Hub takes minutes, and RunPod bills the entire pull. GHCR is still used for
      # the BUILD CACHE, which never leaves CI and so never affects pod start time.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/pipeline.Dockerfile
          platforms: linux/amd64        # RunPod is x86; an arm64 image fails there opaquely
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Registry cache, not GHA cache. The Actions cache is capped at 10 GB per
          # REPOSITORY and this image is 6 GB alone, so the two evicted each
          # other and every build started cold — which is why editing a shell script
          # rebuilt a conda environment. Layering was never the problem: scripts are
          # copied last, so a script change touches a handful of tiny layers PROVIDED the
          # layers beneath them survive.
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/lingua-pipeline:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/lingua-pipeline:buildcache,mode=max
