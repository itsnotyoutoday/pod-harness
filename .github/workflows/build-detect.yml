name: Build detect image

# The analysis image: numpy, scipy and scikit-learn, and deliberately no audio stack.
#
# Separate from build-harness.yml because the two images answer to different changes. The
# slim harness rebuilds when the harness scripts move; this rebuilds when the numerical
# dependencies do. Sharing one workflow would rebuild 450 MB every time a shell script
# gained a line.

on:
  push:
    branches: [main]
    paths:
      - 'docker/detect.Dockerfile'
      - 'requirements-serve.txt'
      # The engine and harness that EVERY image embeds. A change here genuinely
      # invalidates every image — each carries its own copy, so the copy really is stale.
      # This is not filterable; it is the price of baking the engine in, and the
      # alternative (fetching it at boot) reintroduces the version drift that cost three
      # separate incidents.
      - 'src/**'
      - 'serve/**'
      - 'docker/harness/**'
      - 'docker/assert_*.py'
      - 'contract.json'
      - '.github/workflows/build-harness.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The contract and independence checks run in test.yml, and again inside the
      # image build itself via assert_independence.py — so a broken image cannot be
      # published even if a workflow forgets to check.

      - name: Compute tags
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          SHA=$(git rev-parse --short HEAD)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          if [ -n "${{ secrets.DOCKERHUB_USER }}" ]; then
            HUB='${{ secrets.DOCKERHUB_USER }}'
            echo "tags=docker.io/$HUB/lingua-detect:latest,docker.io/$HUB/lingua-detect:$SHA" >> $GITHUB_OUTPUT
            echo "::notice::publishing to Docker Hub as $HUB/lingua-detect"
          else
            echo "tags=ghcr.io/$OWNER/lingua-detect:latest,ghcr.io/$OWNER/lingua-detect:$SHA" >> $GITHUB_OUTPUT
            echo "::warning::no DOCKERHUB_USER secret — publishing to GHCR, whose pull latency from RunPod is unpredictable"
          fi

      # Docker Hub is the publish target. GHCR serves through Fastly and DNS frequently
      # resolves to a distant or degraded edge: 45-minute pulls have been reported where
      # Docker Hub takes minutes, and RunPod bills the entire pull. GHCR is still used for
      # the BUILD CACHE, which never leaves CI and so never affects pod start time.
      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        env:
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/detect.Dockerfile
          platforms: linux/amd64        # RunPod is x86; an arm64 image fails there opaquely
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Registry cache, not GHA cache. The Actions cache is capped at 10 GB per
          # REPOSITORY and the sibling MFA image is 6 GB alone, so the two evicted each
          # other and every build started cold — which is why editing a shell script
          # rebuilt a conda environment. Layering was never the problem: scripts are
          # copied last, so a script change touches a handful of tiny layers PROVIDED the
          # layers beneath them survive.
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/lingua-detect:buildcache,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/lingua-detect:buildcache,mode=max
