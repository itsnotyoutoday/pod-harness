name: Build ComfyUI images

# podh-comfyui and podh-comfyui-video. GPU images, run by podh-boot.
#
# Two jobs in one workflow, unlike the other images, because they are one thing in two
# layers: the video image is built FROM the exact digest the base job just pushed, so a run
# that rebuilds the base must rebuild the video image on top of it, and a failed base must
# stop the video build rather than leave it on an older base.
#
# Layers are pushed zstd-compressed (outputs: below), which a pulling host must support:
# Docker >= 23 or containerd >= 1.5.
#
# Tags: <comfyui tag>-cu128-<short sha> and latest. The ComfyUI tag is read from the
# Dockerfile, so the tag cannot claim a release the image does not contain.
#
# Published to Docker Hub (the primary pull source: measured faster from RunPod, 137 s
# against 158 s for the same image in the same data centre) when DOCKERHUB_USER/
# DOCKERHUB_TOKEN exist, and to GHCR always, as the mirror.
#
# After each push, the image's /opt/podh/manifest.json and catalogue.json are published as
# GitHub release assets (docker/comfyui/publish-identity): release images-<image>-<short sha>
# for this build, and the rolling images-latest with index.json — so an app can read what an
# image holds without a pod. Only the identity layer's blob is fetched, not the image.

on:
  push:
    branches: [main]
    paths:
      - 'docker/comfyui.Dockerfile'
      - 'docker/comfyui-video.Dockerfile'
      - 'docker/comfyui/**'
      # The engine every image embeds: podh-boot is this image's entrypoint.
      - 'src/**'
      - 'serve/**'
      - 'docker/harness/**'
      - 'docker/assert_*.py'
      - 'contract.json'
      - 'pyproject.toml'
      - '.github/workflows/build-comfyui.yml'
  workflow_dispatch:

permissions:
  contents: write       # release assets: the images' manifest and catalogue
  packages: write

concurrency:
  group: build-comfyui-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USER }}

jobs:
  base:
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      owner: ${{ steps.meta.outputs.owner }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # The harness's own checks, before spending an hour on an image that embeds it.
      - name: Contract, independence, env
        run: |
          PYTHONPATH=src python3 docker/assert_contract.py
          PYTHONPATH=src python3 docker/assert_independence.py
          PYTHONPATH=src python3 docker/assert_env.py

      - name: Compute tags
        id: meta
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          SHA=$(git rev-parse --short HEAD)
          TAG=$(sed -n 's/^ARG COMFYUI_TAG=//p' docker/comfyui.Dockerfile)
          test -n "$TAG" || { echo "::error::no ARG COMFYUI_TAG in docker/comfyui.Dockerfile"; exit 1; }
          VERSION="$TAG-cu128-$SHA"
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          TAGS="ghcr.io/$OWNER/podh-comfyui:$VERSION,ghcr.io/$OWNER/podh-comfyui:latest"
          if [ -n "$DOCKERHUB_USER" ]; then
            TAGS="$TAGS,docker.io/$DOCKERHUB_USER/podh-comfyui:$VERSION,docker.io/$DOCKERHUB_USER/podh-comfyui:latest"
          else
            echo "::warning::no DOCKERHUB_USER secret — publishing to GHCR only"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT

      # The image is over 10 GB unpacked; the runner starts with ~20 GB free.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push podh-comfyui
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/comfyui.Dockerfile
          platforms: linux/amd64        # RunPod is x86; an arm64 image fails there opaquely
          tags: ${{ steps.meta.outputs.tags }}
          # Only the last (identity) layer reads these: the manifest's version and revision.
          build-args: |
            IMAGE_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          # Pushed to every tag above, every layer zstd: smaller than gzip and several times
          # faster to decompress, which is most of a pod's pull. force-compression recompresses
          # layers that arrive as gzip (Ubuntu's, a gzip cache). Pulling needs Docker >= 23 /
          # containerd >= 1.5 — see the README.
          outputs: type=image,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          # Registry cache, as build-harness.yml explains: the Actions cache is 10 GB per
          # repository, less than this image alone. Also zstd, so a cached layer is pushed
          # as-is instead of being recompressed.
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/podh-comfyui:buildcache,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/podh-comfyui:buildcache,mode=max,ignore-error=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true

      - name: Digest
        run: echo "::notice::podh-comfyui ${{ steps.meta.outputs.version }} = ${{ steps.build.outputs.digest }}"

      - uses: imjasonh/setup-crane@v0.4

      - name: Publish manifest and catalogue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          PRIMARY=""
          if [ -n "$DOCKERHUB_USER" ]; then PRIMARY="docker.io/$DOCKERHUB_USER/podh-comfyui"; fi
          bash docker/comfyui/publish-identity --name podh-comfyui \
            --version '${{ steps.meta.outputs.version }}' --digest '${{ steps.build.outputs.digest }}' \
            --revision '${{ github.sha }}' --mirror "ghcr.io/$OWNER/podh-comfyui" \
            ${PRIMARY:+--primary "$PRIMARY"} --repo '${{ github.repository }}'

  video:
    needs: base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compute tags
        id: meta
        run: |
          # Recomputed here, not taken from the base job: GitHub blanks a job output whose
          # value matches a secret (the owner equals DOCKERHUB_USER), which gave "ghcr.io//…".
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          echo "owner=$OWNER" >> $GITHUB_OUTPUT
          VERSION='${{ needs.base.outputs.version }}'
          TAGS="ghcr.io/$OWNER/podh-comfyui-video:$VERSION,ghcr.io/$OWNER/podh-comfyui-video:latest"
          if [ -n "$DOCKERHUB_USER" ]; then
            TAGS="$TAGS,docker.io/$DOCKERHUB_USER/podh-comfyui-video:$VERSION,docker.io/$DOCKERHUB_USER/podh-comfyui-video:latest"
          fi
          echo "tags=$TAGS" >> $GITHUB_OUTPUT
          echo "base=ghcr.io/$OWNER/podh-comfyui@${{ needs.base.outputs.digest }}" >> $GITHUB_OUTPUT

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force >/dev/null || true
          df -h /

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USER != ''
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Also how this job PULLS the base: a new GHCR package starts private.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push podh-comfyui-video
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/comfyui-video.Dockerfile
          platforms: linux/amd64
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base }}
            IMAGE_VERSION=${{ needs.base.outputs.version }}
            GIT_SHA=${{ github.sha }}
            SOURCE_URL=${{ github.server_url }}/${{ github.repository }}
          tags: ${{ steps.meta.outputs.tags }}
          # As the base's: zstd throughout (the base's own layers already are).
          outputs: type=image,push=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true
          cache-from: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/podh-comfyui-video:buildcache,ignore-error=true
          cache-to: type=registry,ref=ghcr.io/${{ steps.meta.outputs.owner }}/podh-comfyui-video:buildcache,mode=max,ignore-error=true,compression=zstd,compression-level=3,force-compression=true,oci-mediatypes=true

      - name: Digest
        run: echo "::notice::podh-comfyui-video ${{ needs.base.outputs.version }} = ${{ steps.build.outputs.digest }}"

      - uses: imjasonh/setup-crane@v0.4

      - name: Publish manifest and catalogue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo '${{ github.repository_owner }}' | tr A-Z a-z)
          PRIMARY=""
          if [ -n "$DOCKERHUB_USER" ]; then PRIMARY="docker.io/$DOCKERHUB_USER/podh-comfyui-video"; fi
          bash docker/comfyui/publish-identity --name podh-comfyui-video \
            --version '${{ needs.base.outputs.version }}' --digest '${{ steps.build.outputs.digest }}' \
            --revision '${{ github.sha }}' --mirror "ghcr.io/$OWNER/podh-comfyui-video" \
            ${PRIMARY:+--primary "$PRIMARY"} --repo '${{ github.repository }}'
