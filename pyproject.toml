[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pod-harness"
version = "0.2.0"
description = "The in-pod execution engine: stage model, verification, resume, status"
# 3.9 because that is what ships on macOS and what this actually runs on — every module
# imports under it, since the annotations are all postponed via __future__. Claiming 3.10
# made "pip install -e ." fail outright on the maintainer's own machine.
requires-python = ">=3.9"

# Deliberately minimal, and it must stay that way. This is imported inside every image,
# including GPU ones where each megabyte is cold-start latency. boto3 is here because the
# harness reads its spec and publishes its status through object storage; nothing else is
# needed to run a job.
#
# Note what is NOT here: nothing of ours. The harness depends on no other lingua package.
# It talks to the loader through four contracts — the job spec schema, the event/status
# schema, the environment variable names and the /v1 endpoints — and shares no code with
# it. That is what lets the harness stay frozen while the pipelines above it change.
dependencies = [
    "boto3>=1.34",
]

[project.optional-dependencies]
# The control surface. Only needed when the image serves /v1, which is every pod today but
# need not be true of a serverless worker.
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dev = ["pytest>=8"]

[project.scripts]
# Sidecar mode only: the full harness ships as its own image, not as a pip install. The
# harness image runs the same modules as `python3 -m pod_harness.<name>` instead.
podh-serve = "pod_harness.sidecar:main"
# Boot progress and completion reports for a hot-installed image's own boot script. Imports
# only the stdlib client, so it works without the [serve] extra.
podh-report = "pod_harness.report:main"
# Is the GPU usable? Exit 7 if not. Also `--scan-log FILE` for supervisors.
podh-gpucheck = "pod_harness.gpucheck:main"
# Cached tarballs (a venv, a binary, an addon set): get exits 2 when there is none yet.
podh-kit = "pod_harness.kits:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
